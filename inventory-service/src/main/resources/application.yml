server:
  port: 8083

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/inventory_db
    username: ${DB_USER:railway}
    password: ${DB_PASSWORD:railway}
    hikari:
      maximum-pool-size: 15
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # Detect a dead consumer in ~10s (default 45s) so its partitions move to a survivor quickly.
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
    listener:
      # One thread per partition at most; with 6 partitions two instances get 3 threads each.
      concurrency: 3

inventory:
  # Experiment toggle: with false, concurrent allocators queue behind each other's row locks.
  skip-locked: ${INVENTORY_SKIP_LOCKED:true}
  reaper-interval-ms: 2000
  snapshot-interval-ms: 30000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints.web.exposure.include: health,info,prometheus
