server {
  listen 80;
  root /usr/share/nginx/html;

  # Re-resolve the gateway through Docker's DNS instead of caching its IP at startup, so the UI
  # keeps working when the gateway container is restarted or recreated (new IP).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Same-origin API: the browser only ever talks to this host; nginx forwards to the gateway.
  location /api/ {
    set $gateway http://api-gateway:8080;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  # Hashed assets can be cached forever; index.html must be revalidated so deploys show up.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
